<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — StoreAdmin</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="bg-[#F8F9FB] min-h-screen flex items-center justify-center">

  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Store<span class="text-indigo-600">Admin</span></h1>
      <p class="text-sm text-slate-500 mt-1">Sign in to manage your store</p>
    </div>

    <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-8">
      <form class="space-y-5" id="form">
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
          <input type="email" id="email" placeholder="you@store.com"
            class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
          <input type="password" id="password" placeholder="••••••••"
            class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <div id="login-error" class="hidden text-sm text-red-600 bg-red-50 border border-red-100 rounded-lg px-3 py-2">
          Invalid email or password.
        </div>

        <button type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-2.5 rounded-lg transition-colors">
          Sign In
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-slate-400 mt-6">Admin access only · StoreAdmin Panel</p>
  </div>

 
<script type="module" src="index.js"></script>
</body>
</html>
