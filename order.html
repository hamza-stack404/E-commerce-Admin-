<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — StoreAdmin</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#F8F9FB] text-slate-900">

  <!-- Sidebar -->
  <aside class="w-64 bg-white border-r border-slate-200 h-screen fixed left-0 top-0 flex flex-col">
    <div class="px-6 py-5 border-b border-slate-200">
      <h1 class="text-lg font-bold tracking-tight">Store<span class="text-indigo-600">Admin</span></h1>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1">
      <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">
        Dashboard
      </a>
      <a href="product.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">
        Products
      </a>
      <a href="Category.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">
        Categories
      </a>
      <a href="order.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-indigo-50 text-indigo-700 border-l-2 border-indigo-600 -ml-0.5 pl-3.5">
        Orders
      </a>
    </nav>
    <div class="px-3 py-4 border-t border-slate-200">
      <a href="login.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-500 hover:bg-slate-50">
        Log out
      </a>
    </div>
  </aside>

  <!-- Main -->
  <div class="ml-64">
    <header class="bg-white border-b border-slate-200 px-8 py-4 flex items-center justify-between">
      <h2 class="text-lg font-semibold text-slate-900">Orders</h2>
      <div class="flex items-center gap-3">
        <span class="text-sm text-slate-500">Hi, Admin</span>
        <div class="w-8 h-8 rounded-full bg-indigo-600 text-white text-xs font-semibold flex items-center justify-center">A</div>
      </div>
    </header>

    <main class="p-8 space-y-6">

      <div class="flex items-center justify-between gap-4">
        <div class="relative w-full max-w-xs">
          <input type="text" id="order-search" placeholder="Search by customer or order ID..."
            class="w-full pl-4 pr-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        <select id="order-status-filter"
          class="border border-slate-300 rounded-lg text-sm px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
          <option value="all">All Statuses</option>
          <option value="pending">Pending</option>
          <option value="shipped">Shipped</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>

      <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left text-slate-500 border-b border-slate-100">
              <th class="px-6 py-3 font-medium">Order ID</th>
              <th class="px-6 py-3 font-medium">Customer</th>
              <th class="px-6 py-3 font-medium">Date</th>
              <th class="px-6 py-3 font-medium">Items</th>
              <th class="px-6 py-3 font-medium">Total</th>
              <th class="px-6 py-3 font-medium">Status</th>
              <th class="px-6 py-3 font-medium text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="orders-table-body" class="divide-y divide-slate-100">

          </tbody>
        </table>
      </div>

    </main>
  </div>

<script type="module" src="order.js"></script>
</body>
</html>
