<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Category — StoreAdmin</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#F8F9FB] text-slate-900">

  <!-- Sidebar -->
  <aside class="w-64 bg-white border-r border-slate-200 h-screen fixed left-0 top-0 flex flex-col">
    <div class="px-6 py-5 border-b border-slate-200">
      <h1 class="text-lg font-bold tracking-tight">Store<span class="text-indigo-600">Admin</span></h1>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1">
      <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">
        Dashboard
      </a>
      <a href="product.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">
        Products
      </a>
      <a href="Category.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-indigo-50 text-indigo-700 border-l-2 border-indigo-600 -ml-0.5 pl-3.5">
        Categories
      </a>
      <a href="order.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">
        Orders
      </a>
    </nav>
    <div class="px-3 py-4 border-t border-slate-200">
      <a href="login.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-500 hover:bg-slate-50">
        Log out
      </a>
    </div>
  </aside>

  <!-- Main -->
  <div class="ml-64">
    <header class="bg-white border-b border-slate-200 px-8 py-4 flex items-center gap-3">
      <a href="Category.html" class="text-slate-400 hover:text-slate-600 text-sm">Categories</a>
      <span class="text-slate-300">/</span>
      <h2 class="text-lg font-semibold text-slate-900">Add Category</h2>
    </header>

    <main class="p-8 max-w-2xl">
      <form id="category-form" class="bg-white border border-slate-200 rounded-xl p-8 space-y-6">

        <div>
          <label for="c-name" class="block text-sm font-medium text-slate-700 mb-1.5">Category Name</label>
          <input type="text" id="c-name" placeholder="e.g. Electronics"
            class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <div>
          <label for="c-desc" class="block text-sm font-medium text-slate-700 mb-1.5">Description</label>
          <textarea id="c-desc" rows="3" placeholder="Short description of this category..."
            class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"></textarea>
        </div>

        <div class="flex items-center gap-3">
          <input type="checkbox" id="c-visible" checked
            class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
          <label for="c-visible" class="text-sm text-slate-700">Visible on storefront</label>
        </div>

        <label for="c-image" class="block border-2 border-dashed border-slate-300 rounded-lg py-8 text-center cursor-pointer">
           <p class="text-sm text-slate-500" id="category-image-filename">Click or drag an image here</p>
            <input type="file" id="c-image" class="hidden" accept="image/*">
        </label>

        <div class="flex items-center gap-3 pt-2">
          <button type="submit"
            class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition-colors">
            Save Category
          </button>
          <a href="Category.html" class="text-sm font-medium text-slate-600 hover:text-slate-900 px-5 py-2.5">
            Cancel
          </a>
        </div>

      </form>
    </main>
  </div>

<script type="module" src="CategoryAdd.js"></script>
</body>
</html>
